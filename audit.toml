# cargo-audit accept-list. Re-check on every dependency upgrade round:
# remove an entry once the advisory is fixed upstream and `cargo update`
# pulls the fixed version. Review dates below are expiry reminders, not
# grace periods: an entry past its date must be re-justified or dropped.
[advisories]
ignore = [
    # paste 1.0.15 unmaintained (RUSTSEC-2024-0436). Transitive via the iced
    # 0.14 macro stack. Upstream-only fix. Review by 2027-04.
    "RUSTSEC-2024-0436",
    # ttf-parser 0.25.1 unmaintained (RUSTSEC-2026-0192). Transitive via
    # fontdb/cosmic-text. Upstream-only fix. Review by 2027-04.
    "RUSTSEC-2026-0192",
    # lru 0.16.4 unsound pop() under panic-unwind (RUSTSEC-2026-0253).
    # Not exploitable here: nothing panics in the glyph-cache path, so the
    # unsound unwind path is unreachable. Release uses unwind (not abort) so
    # the background supervisor and fan handover survive panics. Transitive
    # via cryoglyph/iced_wgpu. Upstream-only fix. Review by 2027-04.
    "RUSTSEC-2026-0253",
]
