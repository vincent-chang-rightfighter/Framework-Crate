[package]
name = "framework-crate"
version = "0.5.1"
edition = "2024"
authors = ["Vincent Chang"]
license = "MIT"

[dependencies]
iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "tokio",
    "canvas",
    "advanced",
] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "time",
    "macros",
    "sync",
] }
serde = { version = "1", features = ["derive"] }
toml = "1"
framework_lib = "0.6.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
core_affinity = "0.8"
parking_lot = "0.12"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
sha2 = "0.10"
smallvec = "1"

[build-dependencies]
winresource = "0.1"
png = "0.17"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
