name: Rust CI

# No workflow-wide permissions: each job declares the minimum it needs, so a
# compromised third-party action cannot escalate beyond its own job.
on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
    # Docs, the GitHub Pages site, screenshots, and icon assets cannot break
    # the Rust code, so skip them. Tag pushes are not evaluated against path
    # filters, so releases always run the full pipeline (assets/ is a build
    # input via cargo:rerun-if-changed and is covered there).
    paths-ignore:
      - '**/*.md'
      - 'images/**'
      - 'docs/**'
      - 'assets/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'images/**'
      - 'docs/**'
      - 'assets/**'

jobs:
  build-and-test:
    permissions:
      contents: read
      actions: write # upload-artifact
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build debug binary
        run: cargo build --locked --verbose

      - name: Test
        run: cargo test --locked --verbose

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Audit dependencies
        # Pinned deliberately: unpinned installs drift with upstream and can
        # break the pipeline (or worse) without a local change. Bump by hand.
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit

      - name: Build release binary
        run: cargo build --locked --release --verbose

      - name: Upload release EXE artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: framework-crate-windows-release
          path: target/release/framework-crate.exe

  msrv:
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check MSRV
        run: cargo check --locked --all-targets

  release:
    needs: [build-and-test, msrv]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      actions: read # download-artifact
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download release EXE artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: framework-crate-windows-release
          path: dist

      - name: Checksums
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\framework-crate.exe -Algorithm SHA256).Hash
          "$hash  framework-crate.exe" | Out-File -Encoding ascii SHA256SUMS
          Get-Content SHA256SUMS

      - name: Install git-cliff
        shell: pwsh
        run: |
          $ver = "2.13.1"
          $url = "https://github.com/orhun/git-cliff/releases/download/v${ver}/git-cliff-${ver}-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest $url -OutFile gitcliff.zip
          # No upstream checksum file ships for the Windows zip, so the hash
          # below is trust-on-first-use (pinned 2026-10-05). It still catches
          # any later replacement of the asset. Update it when bumping $ver.
          $hash = (Get-FileHash gitcliff.zip -Algorithm SHA256).Hash
          if ($hash -ne "3AE3A5549E85C7AD5B20192EBCFEE4371269DECA51255F6F2F2E051C6541F5CA") { throw "git-cliff checksum mismatch: $hash" }
          Expand-Archive gitcliff.zip -DestinationPath gitcliff
          $exe = Get-ChildItem -Recurse -Filter git-cliff.exe gitcliff | Select-Object -First 1
          Write-Output "git-cliff installed at $($exe.DirectoryName)"

      - name: Generate changelog
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter git-cliff.exe gitcliff | Select-Object -First 1
          & $exe.FullName --config cliff.toml --latest --strip header --output release_notes.md
          # git-cliff separates every bullet with a blank line; collapse those
          # so the published notes read as compact lists (one blank line
          # between groups).
          $notes = Get-Content release_notes.md -Raw
          $notes = $notes -replace "(?m)^\r?\n(?=- )", ""
          $notes = $notes -replace "(\r?\n){3,}", "`n`n"
          Set-Content -Path release_notes.md -Value $notes -NoNewline -Encoding utf8
          Get-Content release_notes.md

      - name: Append contributors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $prev = git describe --tags --abbrev=0 "$tag^" 2>$null
          if ($prev) { $range = "${prev}...${tag}" } else { $range = $tag }
          $owner = $env:GITHUB_REPOSITORY_OWNER
          $logins = gh api "repos/$env:GITHUB_REPOSITORY/compare/$range" --jq '.commits[].author.login' 2>$null
          $contribs = $logins |
            Where-Object { $_ -and $_ -ne "github-actions[bot]" -and $_ -ne $owner } |
            Sort-Object -Unique
          if ($contribs) {
            $line = "`n**Contributors**: " + (($contribs | ForEach-Object { "@$_" }) -join ", ")
            Add-Content -Path release_notes.md -Value $line -Encoding utf8
          }

      - name: VirusTotal scan
        # Uploads the release binary and waits for the multi-engine scan to
        # finish, so the note added to the release page points at a completed
        # report. Never blocks a release (continue-on-error + bounded wait),
        # and the key is only exposed to this tag-gated job (repository
        # secret). Once a signing step exists it must run BEFORE the
        # checksums step so this hash matches the signed binary.
        continue-on-error: true
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          if (-not $env:VT_API_KEY) {
            Write-Output "VIRUSTOTAL_API_KEY not configured; skipping upload."
            exit 0
          }
          $hash = (Get-FileHash dist\framework-crate.exe -Algorithm SHA256).Hash.ToLower()
          $link = "https://www.virustotal.com/gui/file/$hash"
          function Get-VtJson([string]$url, [string]$method) {
            if ($method -eq "POST") {
              $raw = curl.exe -sS -X POST --form "file=@dist/framework-crate.exe" --header "x-apikey: $env:VT_API_KEY" $url
            } else {
              $raw = curl.exe -sS --header "x-apikey: $env:VT_API_KEY" $url
            }
            if ($LASTEXITCODE -ne 0 -or -not $raw) { return $null }
            try { return ($raw | ConvertFrom-Json) } catch { return $null }
          }
          $upload = Get-VtJson "https://www.virustotal.com/api/v3/files" "POST"
          if (-not $upload) {
            Write-Output "VirusTotal upload failed; publishing without a report link."
            exit 0
          }
          $analysisId = $upload.data.id
          $status = $upload.data.attributes.status
          $analysis = $upload
          # Free API allows 4 requests/minute: poll every 30s, up to 12 min.
          for ($i = 0; $i -lt 24 -and $status -ne "completed"; $i++) {
            Start-Sleep -Seconds 30
            $analysis = Get-VtJson "https://www.virustotal.com/api/v3/analyses/$analysisId" "GET"
            if (-not $analysis) { break }
            $status = $analysis.data.attributes.status
            Write-Output "VirusTotal analysis status: $status"
          }
          $verdict = ""
          if ($analysis -and $analysis.data.attributes.stats) {
            $s = $analysis.data.attributes.stats
            $total = ($s.harmless + $s.malicious + $s.suspicious + $s.undetected + $s.timeout)
            $verdict = "`n  - $($s.malicious) malicious, $($s.suspicious) suspicious of $total engines"
          }
          if ($status -ne "completed") {
            Write-Output "VirusTotal analysis did not complete in time; publishing the link anyway."
          }
          Add-Content -Path release_notes.md -Value "`n### Verification`n- **VirusTotal**: $link$verdict" -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            dist/framework-crate.exe
            SHA256SUMS
          body_path: release_notes.md
          generate_release_notes: false
          make_latest: true
