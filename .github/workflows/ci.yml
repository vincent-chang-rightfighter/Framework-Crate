name: Rust CI

permissions:
  contents: write

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build debug binary
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Upload release EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: framework-crate-windows-release
          path: target/release/framework-crate.exe

      - name: Install git-cliff
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ver = "2.13.1"
          $url = "https://github.com/orhun/git-cliff/releases/download/v${ver}/git-cliff-${ver}-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest $url -OutFile gitcliff.zip
          Expand-Archive gitcliff.zip -DestinationPath gitcliff
          $exe = Get-ChildItem -Recurse -Filter git-cliff.exe gitcliff | Select-Object -First 1
          Write-Output "git-cliff installed at $($exe.DirectoryName)"

      - name: Generate changelog
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter git-cliff.exe gitcliff | Select-Object -First 1
          & $exe.FullName --config cliff.toml --latest --strip header --output release_notes.md
          Get-Content release_notes.md

      - name: Append contributors
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $prev = git describe --tags --abbrev=0 "$tag^" 2>$null
          if ($prev) { $range = "${prev}...${tag}" } else { $range = $tag }
          $owner = $env:GITHUB_REPOSITORY_OWNER
          $logins = gh api "repos/$env:GITHUB_REPOSITORY/compare/$range" --jq '.commits[].author.login' 2>$null
          $contribs = $logins |
            Where-Object { $_ -and $_ -ne "github-actions[bot]" -and $_ -ne $owner } |
            Sort-Object -Unique
          if ($contribs) {
            $line = "`n**Contributors**: " + (($contribs | ForEach-Object { "@$_" }) -join ", ")
            Add-Content -Path release_notes.md -Value $line -Encoding utf8
          }

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/framework-crate.exe
          body_path: release_notes.md
          generate_release_notes: false
          make_latest: true
