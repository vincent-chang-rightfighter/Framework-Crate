name: Rust CI

# No workflow-wide permissions: each job declares the minimum it needs, so a
# compromised third-party action cannot escalate beyond its own job.
on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
    # Docs and screenshots cannot break the build, so skip them. Tag pushes are
    # not evaluated against path filters, so releases always run the full
    # pipeline. assets/ is deliberately absent: app.png and app.ico are build
    # inputs declared with cargo:rerun-if-changed.
    paths-ignore:
      - '**/*.md'
      - 'images/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'images/**'

jobs:
  build-and-test:
    permissions:
      contents: read
      actions: write # upload-artifact
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build debug binary
        run: cargo build --locked --verbose

      - name: Test
        run: cargo test --locked --verbose

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Audit dependencies
        # Pinned deliberately: unpinned installs drift with upstream and can
        # break the pipeline (or worse) without a local change. Bump by hand.
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit

      - name: Build release binary
        run: cargo build --locked --release --verbose

      - name: Upload release EXE artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: framework-crate-windows-release
          path: target/release/framework-crate.exe

  msrv:
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check MSRV
        run: cargo check --locked --all-targets

  release:
    needs: [build-and-test, msrv]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      actions: read # download-artifact
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download release EXE artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: framework-crate-windows-release
          path: dist

      - name: Checksums
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\framework-crate.exe -Algorithm SHA256).Hash
          "$hash  framework-crate.exe" | Out-File -Encoding ascii SHA256SUMS
          Get-Content SHA256SUMS

      - name: Install git-cliff
        shell: pwsh
        run: |
          $ver = "2.13.1"
          $url = "https://github.com/orhun/git-cliff/releases/download/v${ver}/git-cliff-${ver}-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest $url -OutFile gitcliff.zip
          # No upstream checksum file ships for the Windows zip, so the hash
          # below is trust-on-first-use (pinned 2026-10-05). It still catches
          # any later replacement of the asset. Update it when bumping $ver.
          $hash = (Get-FileHash gitcliff.zip -Algorithm SHA256).Hash
          if ($hash -ne "3AE3A5549E85C7AD5B20192EBCFEE4371269DECA51255F6F2F2E051C6541F5CA") { throw "git-cliff checksum mismatch: $hash" }
          Expand-Archive gitcliff.zip -DestinationPath gitcliff
          $exe = Get-ChildItem -Recurse -Filter git-cliff.exe gitcliff | Select-Object -First 1
          Write-Output "git-cliff installed at $($exe.DirectoryName)"

      - name: Generate changelog
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter git-cliff.exe gitcliff | Select-Object -First 1
          & $exe.FullName --config cliff.toml --latest --strip header --output release_notes.md
          Get-Content release_notes.md

      - name: Append contributors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $prev = git describe --tags --abbrev=0 "$tag^" 2>$null
          if ($prev) { $range = "${prev}...${tag}" } else { $range = $tag }
          $owner = $env:GITHUB_REPOSITORY_OWNER
          $logins = gh api "repos/$env:GITHUB_REPOSITORY/compare/$range" --jq '.commits[].author.login' 2>$null
          $contribs = $logins |
            Where-Object { $_ -and $_ -ne "github-actions[bot]" -and $_ -ne $owner } |
            Sort-Object -Unique
          if ($contribs) {
            $line = "`n**Contributors**: " + (($contribs | ForEach-Object { "@$_" }) -join ", ")
            Add-Content -Path release_notes.md -Value $line -Encoding utf8
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            dist/framework-crate.exe
            SHA256SUMS
          body_path: release_notes.md
          generate_release_notes: false
          make_latest: true
