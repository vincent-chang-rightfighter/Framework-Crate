version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # One combined PR per cycle instead of one per action; a human still
    # reviews each supply-chain change before merging.
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    # Group routine updates, but keep the pinned framework_lib/PawnIO-related
    # review manual because they affect hardware behavior.
    groups:
      cargo:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"
