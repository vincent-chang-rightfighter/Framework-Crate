version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # One combined PR per cycle instead of one per action; a human still
    # reviews each supply-chain change before merging.
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    # Group routine updates, but keep the pinned framework_lib/PawnIO-related
    # review manual because they affect hardware behavior.
    groups:
      cargo:
        patterns:
          - "*"
    ignore:
      # Stay on parking_lot 0.12 until iced/wgpu move to 0.13. Upgrading
      # now links two parking_lot generations.
      - dependency-name: parking_lot
        update-types:
          - version-update:semver-minor
    commit-message:
      prefix: "deps"
